spring.application.name=mutual-fund-screener-api

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB}
spring.datasource.username=${DB_USERNAME:MUTUAL_FUND_APP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# The schema is installed by the SQL scripts. Never let Hibernate create or
# modify it as a side effect of starting the application.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.registration.enabled=${APP_REGISTRATION_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
logging.level.root=INFO
logging.level.local.mutualfund.screener=INFO
app.nav.amfi-url=${AMFI_NAV_URL:https://www.amfiindia.com/spages/NAVAll.txt}
app.nav.refresh.cron=${NAV_REFRESH_CRON:0 30 19 * * *}
